<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ProxiTechDev</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProxiTechDev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2ec; --surface:#fff; --sand:#e9dfd3;
  --green:#82b550; --green-dark:#5e8f2e; --green-soft:#eef5e6;
  --brown:#4a2a14; --muted:#7c6453; --coral:#ef725c; --coral-soft:#fdeee9;
  --line:#e6ddd2; --shadow:0 2px 10px rgba(74,42,20,.08);
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--brown);font:16px/1.45 Lato,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* barre du haut */
.appbar{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--surface);padding:calc(10px + var(--top)) 12px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line)}
.appbar img{width:34px;height:34px;border-radius:9px}
.appbar .name{font-weight:900;font-size:18px;flex:1}
.appbar .name span{color:var(--green-dark)}
.iconbtn{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--brown)}
.iconbtn:active{background:var(--bg)}
.iconbtn svg{width:24px;height:24px}
.progress{position:fixed;left:0;right:0;top:calc(60px + var(--top));height:4px;background:var(--sand);z-index:10}
.progress div{height:100%;background:var(--green);transition:width .3s}

/* écrans */
.screen{max-width:560px;margin:0 auto;padding:calc(84px + var(--top)) 18px calc(110px + var(--bot));min-height:100%;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 4px}
.q{font-size:25px;font-weight:900;line-height:1.2;margin:0 0 6px}
.help{color:var(--muted);margin:0 0 18px;font-size:15px}

/* champs */
.field{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--brown)}
textarea.field{min-height:150px;resize:none;line-height:1.45}
.field:focus{outline:0;border-color:var(--green)}
.small-label{font-weight:700;font-size:14px;margin:18px 0 8px;display:block}

/* tuiles machine */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:2px solid transparent;border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow);font-weight:700;font-size:15px;text-align:center}
.tile svg{width:40px;height:40px;color:var(--green-dark)}
.tile.on{border-color:var(--green-dark);background:var(--green-soft)}
.tile.wide{grid-column:span 2;flex-direction:row;justify-content:center}

/* pastilles */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:15px}
.pill.on{background:var(--green-dark);border-color:var(--green-dark);color:#fff}

/* micro */
.dictate{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;border:0;background:var(--green-soft);color:var(--green-dark);border-radius:999px;padding:12px 22px;font-weight:900;cursor:pointer}
.dictate svg{width:22px;height:22px}
.dictate.live{background:var(--coral);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,114,92,.5)}70%{box-shadow:0 0 0 14px rgba(239,114,92,0)}100%{box-shadow:0 0 0 0 rgba(239,114,92,0)}}
.kbtip{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}

/* bouton du bas */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(rgba(247,242,236,0),var(--bg) 30%);padding:18px 18px calc(16px + var(--bot))}
.bottom .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.primary{width:100%;border:0;border-radius:16px;padding:17px;background:var(--green-dark);color:#fff;font-weight:900;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px rgba(94,143,46,.3)}
.primary:disabled{background:#b9c9a8;box-shadow:none}
.textbtn{border:0;background:none;color:var(--muted);font-weight:700;padding:8px;cursor:pointer}

/* accueil */
.hello{font-size:15px;color:var(--muted);margin:4px 0 0}
.hero{margin:16px 0 22px;background:var(--green-dark);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(94,143,46,.3)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;border:14px solid rgba(255,255,255,.15)}
.hero h2{margin:0 0 6px;font-size:22px;font-weight:900}
.hero p{margin:0 0 16px;opacity:.9;font-size:15px}
.hero button{border:0;background:#fff;color:var(--green-dark);font-weight:900;font-size:17px;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:8px;cursor:pointer}
.hero button svg{width:22px;height:22px}
.listtitle{font-weight:900;font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.listtitle small{font-weight:400;color:var(--muted);font-size:14px}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.card{width:100%;border:0;font:inherit;color:inherit;cursor:pointer}
.search{margin-bottom:12px;padding:12px 16px;font-size:16px}
.card .dot{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;flex:none}
.card .dot svg{width:22px;height:22px}
.card .t{font-weight:700}
.card .m{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green-dark)}
.tag.wait{background:var(--coral-soft);color:#b5462f}
.empty{text-align:center;color:var(--muted);padding:26px 16px;background:var(--surface);border-radius:16px;border:2px dashed var(--line)}

/* photos */
.camera{width:100%;border:2px dashed var(--green);background:var(--surface);border-radius:18px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--green-dark);font-weight:900;cursor:pointer}
.camera svg{width:44px;height:44px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.thumbs .x{position:relative;aspect-ratio:1}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.thumbs button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(74,42,20,.8);color:#fff;font-size:16px;cursor:pointer}

/* récap */
.recap{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;padding:14px 16px;display:flex;gap:10px}
.recap .c{flex:1;min-width:0}
.recap .l{font-size:13px;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:.05em}
.recap .v{white-space:pre-wrap;word-wrap:break-word}
.recap .iconbtn{color:var(--muted)}

.err{background:var(--coral-soft);color:#b5462f;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + var(--bot));background:var(--brown);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:20;max-width:90%}

/* succès */
.done{text-align:center;padding-top:40px}
.done .check{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--green-dark);color:#fff;display:grid;place-items:center;animation:pop .4s ease}
.done .check svg{width:52px;height:52px}
@keyframes pop{0%{transform:scale(.4)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hp{position:absolute;left:-9999px}
.hero .actions{display:flex;flex-direction:column;gap:10px}
.hero button.alt{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.6)}
.photobtns{display:flex;flex-direction:column;gap:10px}
.gallery{border:0;background:none;color:var(--green-dark);font-weight:700;padding:10px;cursor:pointer;text-decoration:underline}
.draft{background:var(--surface);border-radius:16px;padding:12px;margin:0 0 10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;border-left:5px solid var(--coral)}
.draft img,.draft .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.draft .ph svg{width:26px;height:26px}
.draft .t{font-weight:900}
.draft .m{font-size:13px;color:var(--muted)}
.draft>button{margin-left:auto;border:0;background:var(--green-dark);color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
.complete{background:var(--surface);border-radius:18px;padding:16px;margin:22px 0 18px;box-shadow:var(--shadow);border:2px solid var(--green)}
.complete-head{display:flex;gap:12px;align-items:center}
.complete .dot{width:44px;height:44px;border-radius:12px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;flex:none}
.complete .dot svg{width:24px;height:24px}
.complete .t{font-weight:900;font-size:17px}
.complete .m{font-size:14px;color:var(--muted)}
.complete .search{margin:14px 0 0}
.addph{display:flex;align-items:center;gap:2px;background:var(--green-soft);color:var(--green-dark);border-radius:999px;padding:6px 10px;font-weight:900;flex:none}
.addph svg{width:18px;height:18px}
.sublabel{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 0}
.brandfoot{text-align:center;margin-top:26px}
.brandfoot img{height:34px;opacity:.9}
.brandfoot div{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px}
</style>
</head>
<body>

<div class="appbar">
  <button class="iconbtn hidden" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <img src="icon-192.png" alt="" id="appIcon">
  <div class="name">Proxi<span>TechDev</span></div>
  <button class="iconbtn hidden" id="closeBtn" aria-label="Quitter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="progress hidden" id="progress"><div id="progressBar"></div></div>

<main id="app"></main>

<div class="bottom hidden" id="bottom"><div class="in">
  <button class="primary" id="mainBtn">Continuer</button>
  <button class="textbtn hidden" id="skipBtn">Passer cette étape</button>
</div></div>

<input id="camInput" type="file" accept="image/*" capture="environment" class="hidden">
<input id="galInput" type="file" accept="image/*" multiple class="hidden">

<script>
/* ====== RÉGLAGES : à compléter une seule fois ====== */
const ADRESSE_SCRIPT = "COLLEZ_ICI_L_URL_DU_SCRIPT_GOOGLE"; // se termine par /exec
const CLE = "proxipause-pannes";                           // doit être identique dans le script Google
/* =================================================== */

(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- icônes ---------- */
const I={
 cafe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg>',
 snack:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M15 6h2M15 12h2M15 18h2"/></svg>',
 frais:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v3l2 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-3V2Z"/><path d="M8 12h8"/></svg>',
 eau:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>',
 autre:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>',
 wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-8 8-2-2 6.3-6.3a4 4 0 0 1-5-5L6 14l-2-2 8-8 1.7 1.3"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 mic:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const TYPES=[["Café / boissons chaudes","cafe"],["Snacks","snack"],["Boissons fraîches","frais"],["Fontaine à eau","eau"],["Autre","autre"]];

/* ---------- étapes du formulaire ---------- */
const STEPS=[
 {id:"photosAvant",eyebrow:"À votre arrivée",q:"Commencez par photographier la panne",help:"Avant de toucher à la machine : l'écran, le code erreur, la pièce en cause… Sans personne ni nom de client sur la photo. Pas de photo ? Passez simplement cette étape.",photoKey:"photosAvant"},
 {id:"type",eyebrow:"La machine",q:"Sur quel type de machine ?",req:true},
 {id:"machine",eyebrow:"La machine",q:"Quelle marque et quel modèle ?",req:true},
 {id:"titre",eyebrow:"La panne",q:"Comment appelleriez-vous cette panne ?",help:"En quelques mots. Ex. : « Gobelet vide alors que le café coule »",kind:"input",req:true},
 {id:"symptome",eyebrow:"La panne",q:"Qu'est-ce qui ne marchait pas ?",help:"Ce que voyait le client ou vous-même en arrivant.",kind:"text",req:true,extra:"code"},
 {id:"diagnostic",eyebrow:"Le diagnostic",q:"Qu'avez-vous vérifié ?",help:"Dans l'ordre, une vérification par ligne.",kind:"text",req:true},
 {id:"cause",eyebrow:"Le diagnostic",q:"Quelle était la cause ?",kind:"text",req:true},
 {id:"solution",eyebrow:"La réparation",q:"Comment l'avez-vous réparée ?",help:"Dans l'ordre, une étape par ligne.",kind:"text",req:true},
 {id:"photosApres",eyebrow:"Après réparation",q:"Une photo de la réparation ?",help:"La pièce changée, le réglage fait… Facultatif.",photoKey:"photosApres"},
 {id:"plus",eyebrow:"Pour finir",q:"Quelques détails utiles",help:"Tout est facultatif."},
 {id:"recap",eyebrow:"Vérification",q:"Tout est bon ?",help:"Touchez le crayon pour corriger."}
];

let view="home",idx=0,returnToRecap=false;
let drafts=store.get("ptd_drafts",{});
(function(){const old=store.get("ptd_draft",null);if(old){old.did=old.did||"d"+Date.now().toString(36);drafts[old.did]=old;store.set("ptd_drafts",drafts);try{localStorage.removeItem("ptd_draft")}catch(e){}}})();
let f=blank();
function blank(){return{did:"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:"",marque:"",modele:"",titre:"",symptome:"",code:"",diagnostic:"",cause:"",solution:"",astuce:"",pieces:"",temps:"",difficulte:"",securite:"",photosAvant:[],photosApres:[]}}
Object.values(drafts).forEach(d=>{if(d.photos){d.photosAvant=d.photosAvant||d.photos;delete d.photos}d.photosAvant=d.photosAvant||[];d.photosApres=d.photosApres||[]});
function saveDraft(){if(hasContent(f))drafts[f.did]=f;else delete drafts[f.did];if(!store.set("ptd_drafts",drafts))toast("Mémoire du téléphone pleine : envoyez une fiche ou retirez une photo.")}
function clearDraft(){delete drafts[f.did];store.set("ptd_drafts",drafts)}
function hasContent(d){return !!(d.type||d.marque||d.titre||d.symptome||d.photosAvant.length)}
function hasDraft(){return hasContent(f)}

/* ---------- dictée ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopMic(){if(rec){try{rec.stop()}catch(e){}rec=null}}
function startMic(btn,target){
  if(rec){stopMic();return}
  rec=new SR();rec.lang="fr-FR";rec.continuous=true;rec.interimResults=false;
  btn.classList.add("live");btn.lastChild.textContent=" J'écoute… touchez pour arrêter";
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const t=e.results[i][0].transcript.trim();
    if(t){target.value=(target.value?target.value.replace(/\s*$/," "):"")+t;target.dispatchEvent(new Event("input"))}}};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("Micro refusé : utilisez le micro du clavier.")};
  rec.onend=()=>{btn.classList.remove("live");btn.lastChild.textContent=" Dicter";rec=null};
  try{rec.start()}catch(e){btn.classList.remove("live");rec=null}
}
function micButton(target){
  if(!SR)return '<p class="kbtip">Astuce : touchez le micro de votre clavier pour dicter.</p>';
  return '<button type="button" class="dictate" data-mic="'+target+'">'+I.mic+'<span> Dicter</span></button>';
}

/* ---------- utilitaires d'affichage ---------- */
function toast(msg){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function chrome(opts){
  show($("backBtn"),!!opts.back);show($("closeBtn"),!!opts.close);show($("appIcon"),!opts.back);
  show($("progress"),opts.progress!=null);if(opts.progress!=null)$("progressBar").style.width=opts.progress+"%";
  show($("bottom"),!!opts.main);
  if(opts.main){$("mainBtn").innerHTML=opts.main;$("mainBtn").disabled=!!opts.disabled}
  show($("skipBtn"),!!opts.skip);
}
function show(el,on){el.classList.toggle("hidden",!on)}
function fmt(iso){try{return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}catch(e){return""}}
function typeIcon(t){const x=TYPES.find(a=>a[0]===t);return I[x?x[1]:"wrench"]}

/* ---------- écrans ---------- */
function render(){
  stopMic();window.scrollTo(0,0);
  const app=$("app");
  if(view==="name")return renderName(app);
  if(view==="home")return renderHome(app);
  if(view==="done")return renderDone(app);
  if(view==="detail")return renderDetail(app);
  renderStep(app);
}

function renderName(app){
  app.innerHTML='<section class="screen"><p class="eyebrow">Bienvenue</p><h1 class="q">Votre prénom ou un pseudo ?</h1><p class="help">Il sera ajouté à vos fiches. Pas de nom de famille. On ne vous le demandera qu\'une fois.</p><input class="field" id="nameIn" type="text" autocomplete="off" maxlength="30" placeholder="Ex. Jean ou Tech31" value="'+esc(store.get("ptd_nom",""))+'"></section>';
  chrome({main:"C'est parti",disabled:!$("nameIn").value.trim()});
  $("nameIn").oninput=e=>{$("mainBtn").disabled=!e.target.value.trim()};
  $("mainBtn").onclick=()=>{const v=$("nameIn").value.trim();if(!v)return;store.set("ptd_nom",v);view="home";render()};
}

let histQuery="";
function renderHome(app){
  const nom=store.get("ptd_nom","");const prenom=nom.split(" ")[0];const hist=store.get("ptd_hist",[]);
  const list=Object.values(drafts).filter(hasContent).sort((a,b)=>a.did<b.did?1:-1);
  app.innerHTML='<section class="screen">'+
   '<p class="hello">Bonjour '+esc(prenom)+'</p>'+
   '<div class="hero"><h2>Nouvelle panne ?</h2><p>Arrivé sur place, commencez par la photo. Vous complèterez la fiche une fois la panne réparée.</p>'+
   '<button id="startBtn">'+I.plus+'Déclarer une nouvelle panne</button></div>'+
   (list.length?'<div class="listtitle">Fiches en cours <small>'+list.length+'</small></div>'+list.map(d=>'<div class="draft">'+
     (d.photosAvant.length?'<img alt="" src="data:image/jpeg;base64,'+d.photosAvant[0]+'">':'<div class="ph">'+I.wrench+'</div>')+
     '<div style="min-width:0;flex:1"><div class="t">'+esc(d.titre||[d.marque,d.modele].join(" ").trim()||"Panne sans titre")+'</div><div class="m">'+
     esc([d.titre?[d.marque,d.modele].join(" ").trim():d.type,d.photosAvant.length?d.photosAvant.length+" photo(s)":""].filter(Boolean).join(" · ")||"Commencée")+'</div>'+
     '<button class="textbtn" data-drop="'+d.did+'" style="padding:4px 0;color:#b5462f">Supprimer</button></div><button data-resume="'+d.did+'">Reprendre</button></div>').join(""):'')+
   '<div class="complete">'+
     '<div class="complete-head"><div class="dot">'+I.cam+'</div><div><div class="t">Compléter une ancienne panne</div><div class="m">Une photo oubliée ? Retrouvez la panne ci-dessous et touchez-la pour ajouter des photos.</div></div></div>'+
     (hist.length?'<input class="field search" id="histSearch" type="search" placeholder="Rechercher : machine, panne, date…" value="'+esc(histQuery)+'">':'')+
   '</div>'+
   '<div class="listtitle">Mes pannes déjà déclarées <small>'+hist.length+'</small></div>'+
   (hist.length?'<div id="histList"></div>':'<div class="empty">Vos pannes déclarées apparaîtront ici.<br>Merci de partager votre savoir-faire !</div>')+
   '<div class="brandfoot"><img src="logo.png" alt="ProxiPause et Buenavita"><div>ProxiPause, le réseau qui a du goût</div></div>'+
   '<p style="text-align:center;margin-top:8px"><button class="textbtn" id="renameBtn">Changer de prénom ('+esc(nom)+')</button></p>'+
  '</section>';
  chrome({});
  $("startBtn").onclick=()=>{f=blank();idx=0;returnToRecap=false;view="form";render()};
  app.querySelectorAll("[data-resume]").forEach(b=>b.onclick=()=>{f=drafts[b.dataset.resume];idx=firstIncomplete();returnToRecap=false;view="form";render()});
  app.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{if(b.dataset.sure){delete drafts[b.dataset.drop];store.set("ptd_drafts",drafts);render();toast("Fiche supprimée.")}
    else{b.dataset.sure="1";b.textContent="Toucher à nouveau pour confirmer"}});
  $("renameBtn").onclick=()=>{view="name";render()};
  if($("histSearch")){$("histSearch").oninput=e=>{histQuery=e.target.value;renderHist()}}
  if($("histList"))renderHist();
}
function renderHist(){
  const hist=store.get("ptd_hist",[]).slice().reverse();const q=histQuery.trim().toLowerCase();
  const rows=hist.filter(x=>!q||[x.titre,x.machine,x.type,fmt(x.date),x.symptome].join(" ").toLowerCase().includes(q));
  const el=$("histList");
  el.innerHTML=rows.length?rows.map(x=>'<button class="card" data-uid="'+esc(x.uid)+'"><div class="dot">'+typeIcon(x.type)+'</div><div style="flex:1;min-width:0;text-align:left"><div class="t">'+esc(x.titre)+'</div><div class="m">'+esc(x.machine)+' · '+esc(fmt(x.date))+(x.nbPhotos?' · '+x.nbPhotos+' photo(s)':' · sans photo')+(x.statut==="attente"?' · <b style="color:#b5462f">en attente d\'envoi</b>':'')+'</div></div>'+
     '<span class="addph">'+I.cam+'+</span></button>').join("")
    :'<div class="empty">Aucune panne ne correspond.</div>';
  el.querySelectorAll("[data-uid]").forEach(b=>b.onclick=()=>{detailUid=b.dataset.uid;addPhotos=[];view="detail";render()});
}

/* ---------- panne déjà déclarée : ajouter des photos ---------- */
let detailUid=null,addPhotos=[];
function renderDetail(app){
  const x=store.get("ptd_hist",[]).find(y=>y.uid===detailUid);if(!x){view="home";return render()}
  app.innerHTML='<section class="screen"><p class="eyebrow">Panne déclarée le '+esc(fmt(x.date))+'</p><h1 class="q">'+esc(x.titre)+'</h1><p class="help">'+esc(x.type+" · "+x.machine)+'</p>'+
    (x.symptome?'<div class="recap"><div class="c"><div class="l">Symptôme</div><div class="v">'+esc(x.symptome)+'</div></div></div>':'')+
    '<div class="recap"><div class="c"><div class="l">Photos déjà envoyées</div><div class="v">'+(x.nbPhotos||0)+'</div></div></div>'+
    '<p class="listtitle" style="margin-top:20px">Ajouter des photos</p>'+
    '<div class="photobtns"><button class="camera" id="camBtn">'+I.cam+'<span>Prendre une photo</span></button><button class="gallery" id="galBtn">Choisir dans la galerie</button></div>'+
    '<div class="thumbs" id="thumbs"></div><div id="sendErr" class="err hidden"></div></section>';
  chrome({back:true,main:addPhotos.length?'Envoyer '+addPhotos.length+' photo(s)':'Ajoutez une photo',disabled:!addPhotos.length});
  $("camBtn").onclick=()=>{photoTarget="add";$("camInput").click()};
  $("galBtn").onclick=()=>{photoTarget="add";$("galInput").click()};
  const t=$("thumbs");addPhotos.forEach((p,i)=>{const d=document.createElement("div");d.className="x";
    d.innerHTML='<img alt="Photo '+(i+1)+'" src="data:image/jpeg;base64,'+p+'"><button aria-label="Retirer">×</button>';
    d.querySelector("button").onclick=()=>{addPhotos.splice(i,1);render()};t.appendChild(d)});
  $("mainBtn").onclick=()=>sendAdd(x);
}
async function sendAdd(x){
  const stamp=new Date().toISOString().slice(0,10);
  const photos=addPhotos.map((d,i)=>({name:"ajout_"+stamp+"_"+(i+1)+".jpg",data:d}));
  const btn=$("mainBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Envoi…';
  // fiche encore en attente sur le téléphone : on ajoute les photos directement dedans
  const q=store.get("ptd_queue",[]);const pending=q.find(y=>y.uid===x.uid&&!y.action);
  const done=(msg)=>{bumpPhotos(x.uid,photos.length);addPhotos=[];view="home";render();toast(msg)};
  if(pending){pending.photos=(pending.photos||[]).concat(photos);if(store.set("ptd_queue",q))return done("Photos ajoutées. Elles partiront avec la fiche.");}
  const payload={action:"ajout_photos",cle:CLE,uid:x.uid,technicien:store.get("ptd_nom",""),titre:x.titre,machine:x.machine,photos};
  if(ADRESSE_SCRIPT.indexOf("http")!==0){btn.disabled=false;btn.textContent="Envoyer";$("sendErr").textContent="L'appli n'est pas encore reliée au script Google.";show($("sendErr"),true);return}
  try{await post(payload);done("Photos ajoutées à la fiche.")}
  catch(e){
    if(!navigator.onLine||e instanceof TypeError){q.push(payload);if(store.set("ptd_queue",q))return done("Pas de réseau : les photos partiront dès que possible.")}
    btn.disabled=false;btn.textContent="Réessayer";$("sendErr").textContent=String(e.message||"").indexOf("introuvable")>=0?"Cette fiche n'a pas été retrouvée sur le serveur.":"L'envoi n'a pas marché. Réessayez dans un instant.";show($("sendErr"),true)}
}
function bumpPhotos(uid,n){const h=store.get("ptd_hist",[]);h.forEach(y=>{if(y.uid===uid)y.nbPhotos=(y.nbPhotos||0)+n});store.set("ptd_hist",h)}

function firstIncomplete(){for(let i=0;i<STEPS.length;i++)if(!valid(STEPS[i]))return i;return STEPS.length-1}

function valid(s){
  if(!s.req)return true;
  if(s.id==="type")return !!f.type;
  if(s.id==="machine")return !!(f.marque.trim()&&f.modele.trim());
  return !!String(f[s.id]||"").trim();
}

function renderStep(app){
  const s=STEPS[idx];
  let body="";
  if(s.id==="type"){
    body='<div class="tiles">'+TYPES.map(([t,ic],i)=>'<button class="tile'+(f.type===t?" on":"")+(i===4?" wide":"")+'" data-type="'+esc(t)+'">'+I[ic]+'<span>'+esc(t)+'</span></button>').join("")+'</div>';
  }else if(s.id==="machine"){
    const recents=store.get("ptd_marques",[]);
    body='<label class="small-label" for="in_marque">Marque</label><input class="field" id="in_marque" type="text" placeholder="Ex. Necta, Bianchi…" value="'+esc(f.marque)+'" autocomplete="off">'+
      (recents.length?'<div class="pills" style="margin-top:10px">'+recents.map(m=>'<button class="pill" data-marque="'+esc(m)+'">'+esc(m)+'</button>').join("")+'</div>':'')+
      '<label class="small-label" for="in_modele">Modèle</label><input class="field" id="in_modele" type="text" placeholder="Ex. Kalea, Lei600…" value="'+esc(f.modele)+'" autocomplete="off">';
  }else if(s.kind==="input"){
    body='<input class="field" id="in_'+s.id+'" type="text" value="'+esc(f[s.id])+'">'+micButton("in_"+s.id);
  }else if(s.kind==="text"){
    body='<textarea class="field" id="in_'+s.id+'">'+esc(f[s.id])+'</textarea>'+micButton("in_"+s.id)+
      (s.extra==="code"?'<label class="small-label" for="in_code">Code erreur affiché (si il y en a un)</label><input class="field" id="in_code" type="text" placeholder="Ex. E07" value="'+esc(f.code)+'">':'');
  }else if(s.photoKey){
    body='<div class="photobtns"><button class="camera" id="camBtn">'+I.cam+'<span>'+(f[s.photoKey].length?'Prendre une autre photo':'Prendre une photo')+'</span></button>'+
      '<button class="gallery" id="galBtn">Choisir dans la galerie</button></div><div class="thumbs" id="thumbs"></div>';
  }else if(s.id==="plus"){
    body='<label class="small-label">Temps d\'intervention</label><div class="pills" id="tempsP">'+["5","15","30","60","90+"].map(t=>'<button class="pill'+(f.temps===t?" on":"")+'" data-temps="'+t+'">'+t+' min</button>').join("")+'</div>'+
      '<label class="small-label">Difficulté</label><div class="pills" id="diffP">'+["Facile","Moyenne","Expert"].map(d=>'<button class="pill'+(f.difficulte===d?" on":"")+'" data-diff="'+d+'">'+d+'</button>').join("")+'</div>'+
      '<label class="small-label" for="in_astuce">Une astuce d\'expert ?</label><textarea class="field" id="in_astuce" style="min-height:90px" placeholder="Ce que le manuel ne dit pas">'+esc(f.astuce)+'</textarea>'+
      '<label class="small-label" for="in_pieces">Pièces et outils utilisés</label><input class="field" id="in_pieces" type="text" value="'+esc(f.pieces)+'">'+
      '<label class="small-label" for="in_securite">Précaution de sécurité</label><input class="field" id="in_securite" type="text" placeholder="Ex. couper l\'alimentation" value="'+esc(f.securite)+'">';
  }else if(s.id==="recap"){
    const rows=[["Machine",f.type+" · "+f.marque+" "+f.modele,1],["Panne",f.titre,3],["Symptôme",f.symptome+(f.code?"\nCode : "+f.code:""),4],["Vérifications",f.diagnostic,5],["Cause",f.cause,6],["Réparation",f.solution,7],
      ["Photos",[f.photosAvant.length&&f.photosAvant.length+" à l'arrivée",f.photosApres.length&&f.photosApres.length+" après réparation"].filter(Boolean).join(" · "),0],["Détails",[f.temps&&f.temps+" min",f.difficulte,f.astuce&&"Astuce : "+f.astuce,f.pieces&&"Pièces : "+f.pieces,f.securite&&"Sécurité : "+f.securite].filter(Boolean).join("\n"),9]];
    body=rows.map(([l,v,i])=>'<div class="recap"><div class="c"><div class="l">'+l+'</div><div class="v">'+(v?esc(v):'<span style="color:var(--muted)">—</span>')+'</div></div><button class="iconbtn" data-edit="'+i+'" aria-label="Modifier">'+I.edit+'</button></div>').join("")+
      '<input class="hp" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="sendErr" class="err hidden"></div>';
  }
  app.innerHTML='<section class="screen"><p class="eyebrow">'+esc(s.eyebrow)+'</p><h1 class="q">'+esc(s.q)+'</h1>'+(s.help?'<p class="help">'+esc(s.help)+'</p>':'')+body+'</section>';

  const last=s.id==="recap";
  chrome({back:true,close:true,progress:Math.round((idx+1)/STEPS.length*100),
    main:last?'Envoyer la fiche':(returnToRecap?'Revenir au résumé':(s.photoKey&&!f[s.photoKey].length?'Continuer sans photo':'Continuer')),disabled:!valid(s),skip:(s.id==="plus"&&!returnToRecap)});
  wire(s);
}

function wire(s){
  const app=$("app");
  const refresh=()=>{$("mainBtn").disabled=!valid(s)};
  app.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{f.type=b.dataset.type;saveDraft();setTimeout(next,180);app.querySelectorAll(".tile").forEach(t=>t.classList.toggle("on",t===b));refresh()});
  app.querySelectorAll("[data-marque]").forEach(b=>b.onclick=()=>{$("in_marque").value=b.dataset.marque;$("in_marque").dispatchEvent(new Event("input"));$("in_modele").focus()});
  app.querySelectorAll("input.field,textarea.field").forEach(el=>el.oninput=()=>{f[el.id.replace("in_","")]=el.value;saveDraft();refresh()});
  app.querySelectorAll("[data-mic]").forEach(b=>b.onclick=()=>startMic(b,$(b.dataset.mic)));
  app.querySelectorAll("[data-temps]").forEach(b=>b.onclick=()=>{f.temps=f.temps===b.dataset.temps?"":b.dataset.temps;saveDraft();render()});
  app.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{f.difficulte=f.difficulte===b.dataset.diff?"":b.dataset.diff;saveDraft();render()});
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{idx=+b.dataset.edit;returnToRecap=true;render()});
  if(s.photoKey){$("camBtn").onclick=()=>{photoTarget=s.photoKey;$("camInput").click()};$("galBtn").onclick=()=>{photoTarget=s.photoKey;$("galInput").click()};renderThumbs(s.photoKey)}
  if(s.id==="recap")$("mainBtn").onclick=send;else $("mainBtn").onclick=next;
}

function next(){
  const s=STEPS[idx];if(!valid(s))return;
  if(s.id==="machine"){const r=store.get("ptd_marques",[]).filter(m=>m.toLowerCase()!==f.marque.trim().toLowerCase());r.unshift(f.marque.trim());store.set("ptd_marques",r.slice(0,4))}
  if(returnToRecap){returnToRecap=false;idx=STEPS.length-1}else idx=Math.min(idx+1,STEPS.length-1);
  render();
}
$("skipBtn").onclick=()=>{idx++;render()};
$("backBtn").onclick=()=>{if(returnToRecap){returnToRecap=false;idx=STEPS.length-1}else if(idx>0)idx--;else view="home";render()};
$("closeBtn").onclick=()=>{const k=hasDraft();view="home";render();if(k)toast("Votre fiche est gardée dans « Fiches en cours ».")};

/* ---------- photos ---------- */
let photoTarget="photosAvant";
async function onPhotos(e){
  const files=[...e.target.files];e.target.value="";if(!files.length)return;
  const arr=photoTarget==="add"?addPhotos:f[photoTarget];
  for(const file of files){if(photoTarget==="add"?addPhotos.length>=8:f.photosAvant.length+f.photosApres.length>=8){toast("8 photos maximum à la fois.");break}
    try{arr.push(await shrink(file))}catch(x){toast("Une photo n'a pas pu être ajoutée.")}}
  if(photoTarget!=="add")saveDraft();
  render();
}
$("camInput").onchange=onPhotos;$("galInput").onchange=onPhotos;
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const max=1280;const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.75).split(",")[1])};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
function renderThumbs(key){const t=$("thumbs");if(!t)return;t.innerHTML="";f[key].forEach((p,i)=>{const d=document.createElement("div");d.className="x";
  d.innerHTML='<img alt="Photo '+(i+1)+'" src="data:image/jpeg;base64,'+p+'"><button aria-label="Retirer">×</button>';
  d.querySelector("button").onclick=()=>{f[key].splice(i,1);saveDraft();render()};t.appendChild(d)})}

/* ---------- envoi ---------- */
async function post(fiche){
  const r=await fetch(ADRESSE_SCRIPT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(fiche)});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"refus");return j;
}
function addHist(fiche,statut){const h=store.get("ptd_hist",[]);h.push({uid:fiche.uid,titre:fiche.titre,machine:fiche.marque+" "+fiche.modele,type:fiche.type,date:fiche.date,statut,
  symptome:String(fiche.symptome||"").slice(0,200),nbPhotos:(fiche.photos||[]).length});store.set("ptd_hist",h.slice(-200))}
function markSent(uid){const h=store.get("ptd_hist",[]);h.forEach(x=>{if(x.uid===uid)x.statut="envoyee"});store.set("ptd_hist",h)}
async function flush(){
  const q=store.get("ptd_queue",[]);if(!q.length||!navigator.onLine||ADRESSE_SCRIPT.indexOf("http")!==0)return;const rest=[];
  for(const x of q){try{await post(x);if(!x.action)markSent(x.uid)}catch(e){rest.push(x)}}
  store.set("ptd_queue",rest);if(q.length>rest.length){toast((q.length-rest.length)+" fiche(s) en attente envoyée(s).");if(view==="home")render()}
}
let lastSendOffline=false;
async function send(){
  const errEl=$("sendErr");show(errEl,false);
  if(ADRESSE_SCRIPT.indexOf("http")!==0){errEl.textContent="L'appli n'est pas encore reliée au script Google (réglage ADRESSE_SCRIPT).";show(errEl,true);return}
  const photos=f.photosAvant.map((d,i)=>({name:"arrivee_"+(i+1)+".jpg",data:d})).concat(f.photosApres.map((d,i)=>({name:"apres_reparation_"+(i+1)+".jpg",data:d})));
  const fiche=Object.assign({},f,{photos:photos,photosAvant:undefined,photosApres:undefined,cle:CLE,website:$("website").value,
    technicien:store.get("ptd_nom",""),date:new Date().toISOString(),uid:Date.now().toString(36)+Math.random().toString(36).slice(2,6)});
  const btn=$("mainBtn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Envoi…';
  try{await post(fiche);addHist(fiche,"envoyee");lastSendOffline=false;finish()}
  catch(e){
    if(!navigator.onLine||e instanceof TypeError){const q=store.get("ptd_queue",[]);q.push(fiche);
      if(store.set("ptd_queue",q)){addHist(fiche,"attente");lastSendOffline=true;finish()}
      else{errEl.textContent="Pas de réseau, et trop de photos pour garder la fiche sur le téléphone. Retirez une photo ou réessayez plus tard.";show(errEl,true)}}
    else{errEl.textContent="L'envoi n'a pas marché. Réessayez dans un instant.";show(errEl,true)}
    btn.disabled=false;btn.innerHTML="Envoyer la fiche";
  }
}
function finish(){clearDraft();f=blank();idx=0;returnToRecap=false;view="done";render()}

function renderDone(app){
  app.innerHTML='<section class="screen done"><div class="check">'+I.check+'</div><h1 class="q">'+(lastSendOffline?'Fiche enregistrée':'Merci, c\'est envoyé !')+'</h1><p class="help">'+
    (lastSendOffline?'Pas de réseau pour l\'instant : elle partira toute seule dès que le téléphone captera.':'Votre fiche va être relue par un expert, puis partagée avec toute l\'équipe technique.')+'</p></section>';
  chrome({main:"Retour à l'accueil"});
  $("mainBtn").onclick=()=>{view="home";render()};
}

/* ---------- démarrage ---------- */
view=store.get("ptd_nom","")?"home":"name";
render();
window.addEventListener("online",flush);flush();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
